# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger: 
- main

pr:
- main

pool:
 vmImage: ubuntu-latest

steps:
  - script: |
     echo "Validating Autofix project structure..."
     test -f backend/Dockerfile
     test -f backend/requirements.txt
     test -f Dockerfile
     test -f docker-compose.yml
     echo "Project structure validation passed."
    displayName: 'Validate project structure'

  - script: |
     python -m pip install --upgrade pip
     pip install -r backend/requirements.txt
    displayName: 'Install backend dependencies'  

  - script: |
     docker build -t autofix-backend:ci ./backend
    displayName: 'Build backend Docker image'

  - script: |
     docker build -t autofix-frontend:ci .
    displayName: 'Build frontend Docker image'

  - script: |
     docker compose config
    displayName: 'Validate Docker Compose configuration'    